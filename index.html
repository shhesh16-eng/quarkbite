<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuarkBite Space Gear</title>
<meta name="description" content="Telescopes, books and science gifts picked by QuarkBite — science in seconds.">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#070b1a;--card:#111833;--card2:#18214a;--text:#eef2ff;--muted:#9aa6d1;--accent:#ffd34d;--line:#26315f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#1d2a66 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 15%,#fff6,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 35% 80%,#fff5,transparent),radial-gradient(1px 1px at 55% 45%,#fff4,transparent),radial-gradient(1.5px 1.5px at 10% 65%,#fff6,transparent)}
main{position:relative;max-width:560px;margin:0 auto;padding:36px 16px 48px}
header{text-align:center;margin-bottom:26px}
header img{width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 3px var(--line),0 0 40px #4f6bff55}
h1{font-size:1.6rem;margin-top:12px;letter-spacing:.3px}
.sub{color:var(--muted);margin-top:4px}
.social{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.social a{color:var(--text);text-decoration:none;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#ffffff08}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin:26px 4px 10px}
.item{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;border-radius:16px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s}
.item:hover,.item:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.ico{flex:0 0 52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:1.7rem;background:#ffffff10}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:1rem}
.txt span{display:block;color:var(--muted);font-size:.85rem}
.go{color:var(--accent);font-weight:700;font-size:1.2rem}
.note{color:var(--muted);font-size:.75rem;text-align:center;margin-top:28px;line-height:1.5}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <header>
    <img src="logo.png" alt="QuarkBite logo">
    <h1>QuarkBite Space Gear</h1>
    <p class="sub">See the planets from our videos with your own eyes 🪐</p>
    <nav class="social">
      <a href="https://www.youtube.com/@QuarkBite" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.tiktok.com/@quarkbite" target="_blank" rel="noopener">TikTok</a>
      <a href="https://x.com/quarkbite1" target="_blank" rel="noopener">X</a>
      <a href="https://www.facebook.com/profile.php?id=61596200471537" target="_blank" rel="noopener">Facebook</a>
    </nav>
  </header>
  <div id="list"></div>
  <p class="note">As an Amazon Associate I earn from qualifying purchases.<br>Links open Amazon; prices and availability are set by Amazon.</p>
</main>
<script>
// Paste your Amazon Associates tracking ID here (e.g. "quarkbite-20"). Empty = plain links.
const TAG = "";
const sections = [
  ["See it yourself", [
    ["🔭","Beginner telescope","See Saturn's rings and Jupiter's moons","Celestron beginner telescope"],
    ["🧒","Telescope for kids","Easy first telescope, great gift","telescope for kids beginners"],
    ["🔍","Astronomy binoculars","Moon craters from your balcony","astronomy binoculars"],
    ["🗺️","Star finder map","Find any planet in tonight's sky","planisphere star finder"]
  ]],
  ["Books that blow your mind", [
    ["📘","What If?","Absurd science questions, real answers","What If Randall Munroe book"],
    ["📗","What If? 2","More wild what-ifs","What If 2 Randall Munroe"],
    ["🌌","Cosmos","Carl Sagan's classic","Cosmos Carl Sagan book"],
    ["⚛️","Astrophysics for People in a Hurry","The universe in one short book","Astrophysics for People in a Hurry"]
  ]],
  ["Gifts & room", [
    ["🪐","Solar system model kit","Build and paint the planets","solar system model kit"],
    ["🚀","LEGO space sets","Rockets, rovers, stations","LEGO space set"],
    ["🌕","3D Moon lamp","A glowing Moon for your desk","3D moon lamp"],
    ["✨","Galaxy projector","Turn your ceiling into space","galaxy star projector"],
    ["🧪","Science kit for kids","Real experiments at home","science experiment kit for kids"]
  ]]
];
const list = document.getElementById("list");
for (const [title, items] of sections) {
  const h = document.createElement("h2"); h.textContent = title; list.appendChild(h);
  for (const [ico, name, desc, q] of items) {
    const u = new URL("https://www.amazon.com/s");
    u.searchParams.set("k", q);
    if (TAG) u.searchParams.set("tag", TAG);
    const a = document.createElement("a");
    a.className = "item"; a.href = u.toString(); a.target = "_blank"; a.rel = "nofollow sponsored noopener";
    a.innerHTML = `<div class="ico">${ico}</div><div class="txt"><b></b><span></span></div><div class="go">›</div>`;
    a.querySelector("b").textContent = name; a.querySelector("span").textContent = desc;
    list.appendChild(a);
  }
}
</script>
</body>
</html>
